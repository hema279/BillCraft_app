<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BillCraft - Advanced Invoice Generator</title>
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; padding: 20px; color: #333; }
        .container { max-width: 1000px; margin: auto; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #2c3e50; margin-bottom: 30px; border-bottom: 2px solid #3498db; padding-bottom: 10px; }
        h3 { color: #34495e; margin-top: 30px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .row { display: flex; gap: 20px; margin-bottom: 15px; }
        .col { flex: 1; }
        label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 14px; }
        input[type="text"], input[type="file"], textarea, select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        textarea { height: 80px; resize: vertical; }
        
        .table-responsive { overflow-x: auto; margin-top: 15px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: center; }
        th { background-color: #f8f9fa; font-size: 12px; }
        td input { width: 100%; border: none; outline: none; text-align: center; font-size: 13px; background: transparent; }
        td input:focus { border-bottom: 1px solid #3498db; }
        
        button { padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; font-size: 14px; transition: 0.3s; }
        .btn-add { background-color: #2ecc71; color: white; margin-top: 10px; }
        .btn-add:hover { background-color: #27ae60; }
        .btn-remove { background-color: #e74c3c; color: white; padding: 5px 10px; font-size: 12px; }
        .btn-remove:hover { background-color: #c0392b; }
        .btn-generate { background-color: #3498db; color: white; width: 100%; font-size: 18px; padding: 15px; margin-top: 30px; }
        .btn-generate:hover { background-color: #2980b9; }

        .footer-row { display: flex; gap: 15px; margin-bottom: 10px; align-items: center; background: #f9f9f9; padding: 10px; border-radius: 5px; border: 1px solid #eee; }
        .footer-row input { flex: 1; }
        .info-text { font-size: 12px; color: #7f8c8d; margin-bottom: 10px; }
        
        /* Custom calendar input styling */
        input.flatpickr-input { background-color: white !important; cursor: pointer; }
    </style>
</head>
<body>

<div class="container">
    <h2>BillCraft - Invoice Generator</h2>

    <form id="invoiceForm">
        <h3>1. Basic Details</h3>
        <div class="row">
            <div class="col">
                <label>Bill No:</label>
                <input type="text" id="billNo" placeholder="e.g., 01" required>
            </div>
            <div class="col">
                <label>Date:</label>
                <input type="text" id="billDate" placeholder="DD-MM-YY" required>
            </div>
            <div class="col">
                <label>Orientation:</label>
                <select id="orientation">
                    <option value="L" selected>Landscape (A4)</option>
                    <option value="P">Portrait (A4)</option>
                </select>
            </div>
        </div>
        
        <div class="row">
            <div class="col">
                <label>To Address (Client):</label>
                <textarea id="clientAddress" placeholder="Enter Client Address here..."></textarea>
            </div>
            <div class="col">
                <label>Subject:</label>
                <textarea id="subject" placeholder="Enter Bill Subject..."></textarea>
            </div>
        </div>

        <div class="row">
            <div class="col">
                <label>Period From:</label>
                <input type="text" id="periodFrom" placeholder="DD-MM-YY">
            </div>
            <div class="col">
                <label>Period To:</label>
                <input type="text" id="periodTo" placeholder="DD-MM-YY">
            </div>
        </div>

        <h3>2. Header & Signature Details</h3>
        <div class="row">
            <div class="col">
                <label>Header Image:</label>
                <input type="file" id="headerImg" accept="image/*">
            </div>
            <div class="col">
                <label>Signature Image:</label>
                <input type="file" id="sigImg" accept="image/*">
            </div>
        </div>
        <div class="row">
            <div class="col">
                <label>Company Name:</label>
                <input type="text" id="companyName" placeholder="e.g., For SRI SRINIVASA TRANSPORT">
            </div>
            <div class="col">
                <label>Signer Name:</label>
                <input type="text" id="signerName" placeholder="e.g., (G.SRINU)">
            </div>
        </div>

        <h3>3. Bill Data (Table)</h3>
        <div class="info-text">You can change the columns by typing comma-separated names below. The table will update automatically!</div>
        <label>Table Columns (Comma Separated):</label>
        <input type="text" id="columnNames" value="S.NO, DATE, TRUCK NO, DOC NO, GRAD, UNLOADING, MT, RATE, IN DATE, OUT DATE, FREIGHT" onkeyup="debounceTableGeneration()">

        <div class="table-responsive">
            <table id="dataTable">
                <thead id="tableHead"></thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>
        <button type="button" class="btn-add" onclick="addDataRow()">+ Add Data Row</button>

        <h3>4. Custom Footer Rows (Totals / Balances)</h3>
        <div id="footerContainer">
            <div class="footer-row">
                <input type="text" class="footer-label" value="TOTAL" placeholder="Label">
                <input type="text" class="footer-value" placeholder="Amount">
                <button type="button" class="btn-remove" onclick="this.closest('.footer-row').remove()">X</button>
            </div>
        </div>
        <button type="button" class="btn-add" onclick="addFooterRow()">+ Add Extra Footer Row</button>

        <button type="submit" class="btn-generate">Generate PDF Invoice</button>
    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>

<script>
    // --- FLATPICKR DATE LOGIC ---
    // Bill Date: Auto-fills today's date in DD-MM-YY format
    flatpickr("#billDate", {
        dateFormat: "d-m-y",
        defaultDate: "today",
        allowInput: true
    });

    // Period Dates: Empty by default, selects in DD-MM-YY format
    flatpickr("#periodFrom, #periodTo", {
        dateFormat: "d-m-y",
        allowInput: true
    });
    // ----------------------------

    let timeoutId;
    function debounceTableGeneration() {
        clearTimeout(timeoutId);
        timeoutId = setTimeout(generateTable, 500); 
    }

    function getColumnsArray() {
        return document.getElementById('columnNames').value.split(',').map(c => c.trim()).filter(c => c !== "");
    }

    function generateTable() {
        const cols = getColumnsArray();
        
        const thead = document.getElementById('tableHead');
        thead.innerHTML = '';
        const trHead = document.createElement('tr');
        cols.forEach(col => {
            const th = document.createElement('th');
            th.innerText = col;
            trHead.appendChild(th);
        });
        const actionTh = document.createElement('th');
        actionTh.innerText = 'Action';
        trHead.appendChild(actionTh);
        thead.appendChild(trHead);

        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = '';
        addDataRow();
    }

    function addDataRow() {
        const cols = getColumnsArray();
        const tbody = document.getElementById('tableBody');
        const rowCount = tbody.children.length + 1;
        const formattedSno = rowCount < 10 ? '0' + rowCount : rowCount;
        
        const tr = document.createElement('tr');
        
        cols.forEach((col, index) => {
            const td = document.createElement('td');
            const inp = document.createElement('input');
            inp.type = "text";
            if(index === 0 && (col.toUpperCase() === 'S.NO' || col.toUpperCase() === 'SNO')) {
                inp.value = formattedSno;
            }
            td.appendChild(inp);
            tr.appendChild(td);
        });
        
        const actionTd = document.createElement('td');
        actionTd.innerHTML = `<button type="button" class="btn-remove" onclick="this.closest('tr').remove()">X</button>`;
        tr.appendChild(actionTd);
        
        tbody.appendChild(tr);
    }

    window.onload = generateTable;

    function getBase64(file) {
        return new Promise((resolve, reject) => {
            if (!file) { resolve(""); return; }
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = () => resolve(reader.result.split(',')[1]); 
            reader.onerror = error => reject(error);
        });
    }

    function addFooterRow() {
        const container = document.getElementById('footerContainer');
        const div = document.createElement('div');
        div.className = 'footer-row';
        div.innerHTML = `
            <input type="text" class="footer-label" placeholder="Label (e.g., Old Balance)">
            <input type="text" class="footer-value" placeholder="Amount">
            <button type="button" class="btn-remove" onclick="this.closest('.footer-row').remove()">X</button>
        `;
        container.appendChild(div);
    }

    document.getElementById('invoiceForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const headerFile = document.getElementById('headerImg').files[0];
        const sigFile = document.getElementById('sigImg').files[0];
        const header_b64 = await getBase64(headerFile);
        const sig_b64 = await getBase64(sigFile);

        const rows = [];
        document.querySelectorAll('#tableBody tr').forEach(tr => {
            const inputs = tr.querySelectorAll('td input');
            const rowData = Array.from(inputs).map(inp => inp.value.trim());
            if (rowData.some(val => val !== "")) {
                rows.push({ type: 'data', data: rowData });
            }
        });

        const footers = [];
        document.querySelectorAll('.footer-row').forEach(row => {
            const label = row.querySelector('.footer-label').value.trim();
            const value = row.querySelector('.footer-value').value.trim();
            if (label || value) {
                footers.push({ label: label, value: value });
            }
        });

        const payload = {
            header_b64: header_b64,
            sig_b64: sig_b64,
            data: {
                orientation: document.getElementById('orientation').value,
                bill_no: document.getElementById('billNo').value,
                // Dates are already formatted perfectly by Flatpickr!
                date: document.getElementById('billDate').value,
                client_address: document.getElementById('clientAddress').value.split('\n').filter(line => line.trim() !== ""),
                subject: document.getElementById('subject').value,
                from_date: document.getElementById('periodFrom').value,
                to_date: document.getElementById('periodTo').value,
                company_name: document.getElementById('companyName').value,
                signer_name: document.getElementById('signerName').value,
                columns: getColumnsArray(),
                rows: rows,
                footers: footers
            }
        };

        try {
            const response = await fetch('/', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            if (response.ok) {
                const blob = await response.blob();
                const url = window.URL.createObjectURL(blob);
                window.open(url, '_blank');
            } else {
                alert("Failed to generate PDF. Check server logs.");
            }
        } catch (error) {
            console.error("Error:", error);
            alert("Error connecting to server.");
        }
    });
</script>

</body>
</html>
