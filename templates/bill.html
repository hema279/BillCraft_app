<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BillCraft - Advanced Invoice Generator</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; padding: 20px; color: #333; }
        .container { max-width: 1000px; margin: auto; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #2c3e50; margin-bottom: 30px; border-bottom: 2px solid #3498db; padding-bottom: 10px; }
        h3 { color: #34495e; margin-top: 30px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .row { display: flex; gap: 20px; margin-bottom: 15px; }
        .col { flex: 1; }
        label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 14px; }
        input[type="text"], input[type="file"], textarea, select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        textarea { height: 80px; resize: vertical; }
        
        /* Table Styles */
        .table-responsive { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: center; }
        th { background-color: #f8f9fa; font-size: 12px; }
        td input { width: 100%; border: none; outline: none; text-align: center; font-size: 13px; background: transparent; }
        td input:focus { border-bottom: 1px solid #3498db; }
        
        /* Buttons */
        button { padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; font-size: 14px; transition: 0.3s; }
        .btn-add { background-color: #2ecc71; color: white; margin-top: 10px; }
        .btn-add:hover { background-color: #27ae60; }
        .btn-remove { background-color: #e74c3c; color: white; padding: 5px 10px; font-size: 12px; }
        .btn-remove:hover { background-color: #c0392b; }
        .btn-generate { background-color: #3498db; color: white; width: 100%; font-size: 18px; padding: 15px; margin-top: 30px; }
        .btn-generate:hover { background-color: #2980b9; }

        /* Dynamic Footers */
        .footer-row { display: flex; gap: 15px; margin-bottom: 10px; align-items: center; background: #f9f9f9; padding: 10px; border-radius: 5px; border: 1px solid #eee; }
        .footer-row input { flex: 1; }
    </style>
</head>
<body>

<div class="container">
    <h2>BillCraft - Invoice Generator</h2>

    <form id="invoiceForm">
        <h3>1. Basic Details</h3>
        <div class="row">
            <div class="col">
                <label>Bill No:</label>
                <input type="text" id="billNo" value="02" required>
            </div>
            <div class="col">
                <label>Date:</label>
                <input type="text" id="billDate" placeholder="DD-MM-YY" value="06-03-26" required>
            </div>
            <div class="col">
                <label>Orientation:</label>
                <select id="orientation">
                    <option value="L" selected>Landscape (A4)</option>
                    <option value="P">Portrait (A4)</option>
                </select>
            </div>
        </div>
        
        <div class="row">
            <div class="col">
                <label>To Address (Client):</label>
