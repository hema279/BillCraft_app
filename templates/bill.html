<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>BillCraft Excel Editor</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; max-width: 1200px; margin: auto; padding: 20px; background: #eef2f5; }
        .sheet { background: white; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); border-radius: 6px; }
        
        .row-group { display: flex; gap: 20px; margin-bottom: 15px; }
        .input-group { flex: 1; }
        label { font-weight: bold; font-size: 12px; color: #555; display: block; margin-bottom: 5px; }
        input[type="text"], input[type="number"], textarea, select { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;}
        
        /* Column Manager Styling */
        .col-wrapper { display: flex; align-items: center; gap: 2px; background: #f0f0f0; padding: 4px; border-radius: 4px; margin-right: 5px;}
        .col-wrapper input { width: 120px; font-size: 12px; padding: 5px; border: 1px solid #ccc; }
        .btn-x-small { background: #ff4d4d; color: white; border: none; font-weight: bold; cursor: pointer; padding: 0 6px; height: 100%; border-radius: 3px; font-size: 10px; }
        .btn-x-small:hover { background: #cc0000; }

        /* THE EXCEL GRID */
        table { width: 100%; border-collapse: collapse; margin-top: 15px; background: #fff; table-layout: fixed; }
        th { background: #f4f4f4; border: 1px solid #ccc; padding: 10px; font-size: 13px; text-align: center; }
        td { border: 1px solid #ccc; padding: 0; }
        
        /* Seamless Inputs */
        td input { width: 100%; height: 38px; border: none; padding: 0 10px; box-sizing: border-box; outline: none; font-size: 14px; text-align: center; }
        td input:focus { background: #e8f0fe; }

        /* Buttons */
        .toolbar { margin-top: 15px; display: flex; gap: 10px; }
        button { padding: 10px 15px; border: none; cursor: pointer; border-radius: 4px; font-weight: bold; font-size: 13px; transition: 0.2s; }
        .btn-blue { background: #007bff; color: white; }
        .btn-yellow { background: #ff9800; color: white; }
        .btn-green { background: #28a745; color: white; }
        .btn-red { background: #dc3545; color: white; width: 40px; }
        .btn-gen { background: #222; color: white; width: 100%; padding: 15px; font-size: 18px; margin-top: 20px; }
        
        /* Special Rows */
        .note-input { background: #fffbe6; font-style: italic; color: #555; text-align: left !important; }
        .total-input { background: #f0fff4; font-weight: bold; text-align: right !important; }

    </style>
</head>
<body>

<form action="/" method="POST" enctype="multipart/form-data">

    <div class="sheet">
        <div class="row-group">
            <div class="input-group">
                <label>Header Image</label><input type="file" name="header_img">
            </div>
            <div class="input-group">
                <label>Signature Image</label><input type="file" name="sig_img">
            </div>
            <div class="input-group">
                <label>Font Size</label>
                <select name="font_size">
                    <option value="8">Small (8px)</option>
                    <option value="9">Normal (9px)</option>
                    <option value="10" selected>Medium (10px)</option>
                    <option value="12">Large (12px)</option>
                </select>
            </div>
        </div>

        <div class="row-group">
            <div class="input-group">
                <label>Client Address</label>
                <textarea name="client_address" rows="3" placeholder="To Address..."></textarea>
            </div>
            <div class="input-group">
                <label>Date</label><input type="text" name="date" placeholder="DD-MM-YYYY">
                <div style="display:flex; gap:10px; margin-top:5px;">
                    <div style="flex:1">
                        <label>Bill No (Optional)</label>
                        <input type="text" name="bill_no">
                    </div>
                </div>
            </div>
        </div>
        
        <div class="row-group">
            <div class="input-group" style="flex: 2;">
                <label>Subject Line (Optional)</label>
                <input type="text" name="subject" placeholder="e.g. Transportation Bill for Bitumen...">
            </div>
            <div class="input-group">
                <label>From Date (Optional)</label>
                <input type="text" name="from_date" placeholder="01-01-2026">
            </div>
            <div class="input-group">
                <label>To Date (Optional)</label>
                <input type="text" name="to_date" placeholder="06-01-2026">
            </div>
        </div>
    </div>

    <div class="sheet" style="margin-top:20px;">
        <h3>Bill Details</h3>
        
        <div style="background:#fafafa; padding:10px; border:1px solid #eee; margin-bottom: 10px;">
            <label>Manage Columns:</label>
            <div style="display:flex; align-items:center; gap: 10px; flex-wrap: wrap;">
                <div id="col-container" style="display:flex; flex-wrap: wrap; gap:5px;">
                    </div>
                <button type="button" class="btn-blue" onclick="addNewColumn()" style="height: 32px; padding: 0 15px;">+ Add Col</button>
            </div>
        </div>

        <table id="grid">
            <thead><tr id="header-row"></tr></thead>
            <tbody id="body-rows"></tbody>
        </table>

        <div class="toolbar">
            <button type="button" class="btn-blue" onclick="addRow()">+ Data Row</button>
            <button type="button" class="btn-yellow" onclick="addNoteRow()">+ Merged Note</button>
            <button type="button" class="btn-green" onclick="addTotalRow()">+ Total Row</button>
        </div>
    </div>

    <div class="sheet" style="margin-top:20px">
        <div class="row-group">
            <div class="input-group"><label>Company Name (For Signature)</label><input type="text" name="company_name"></div>
            <div class="input-group"><label>Signer Name</label><input type="text" name="signer_name"></div>
        </div>
    </div>

    <button type="submit" class="btn-gen">GENERATE PDF</button>

</form>

<script>
    // --- 1. COLUMN MANAGEMENT ---

    function createColumnInput(name) {
        let div = document.createElement('div');
        div.className = 'col-wrapper';
        
        let input = document.createElement('input');
        input.type = "text";
        input.name = "col_header";
        input.value = name;
        input.onkeyup = updateTableHeaders; 

        let btn = document.createElement('button');
        btn.innerText = "x";
        btn.className = "btn-x-small";
        btn.type = "button"; 
        btn.onclick = function() { removeColumn(div); };

        div.appendChild(input);
        div.appendChild(btn);
        return div;
    }

    function addNewColumn() {
        let container = document.getElementById('col-container');
        container.appendChild(createColumnInput("New"));
        
        // Add a new cell to every existing row
        let rows = document.getElementById('body-rows').children;
        for (let row of rows) {
            let isDataRow = row.querySelector('input[name="row_type"]').value === 'data';
            if (isDataRow) {
                let td = document.createElement('td');
                let input = document.createElement('input');
                input.type = "text"; input.name = "cell_value";
                td.appendChild(input);
                row.insertBefore(td, row.lastElementChild);
            } else {
                let contentCell = row.children[1]; 
                if(contentCell) contentCell.colSpan += 1;
            }
        }
        updateTableHeaders();
    }

    function removeColumn(colDiv) {
        let container = document.getElementById('col-container');
        let allCols = Array.from(container.children);
        let indexToRemove = allCols.indexOf(colDiv);

        if (indexToRemove === -1) return;
        colDiv.remove();

        let rows = document.getElementById('body-rows').children;
        for (let row of rows) {
            let isDataRow = row.querySelector('input[name="row_type"]').value === 'data';
            if (isDataRow) {
                let tds = row.querySelectorAll('td');
                if (tds[indexToRemove]) tds[indexToRemove].remove();
            } else {
                let contentCell = row.children[1]; 
                if(contentCell && contentCell.colSpan > 1) contentCell.colSpan -= 1;
            }
        }
        updateTableHeaders();
    }

    function updateTableHeaders() {
        let inputs = document.getElementsByName('col_header');
        let headerRow = document.getElementById('header-row');
        headerRow.innerHTML = "";
        
        inputs.forEach(input => {
            let th = document.createElement('th');
            th.innerText = input.value || "Col";
            headerRow.appendChild(th);
        });
        
        let thDel = document.createElement('th');
        thDel.style.width = "40px";
        headerRow.appendChild(thDel);
    }

    // --- 2. ROW MANAGEMENT ---

    function addRow() {
        let tbody = document.getElementById('body-rows');
        let tr = document.createElement('tr');
        
        let type = document.createElement('input');
        type.type = "hidden"; type.name = "row_type"; type.value = "data";
        tr.appendChild(type);

        let colCount = document.getElementsByName('col_header').length;
        for(let i=0; i<colCount; i++) {
            let td = document.createElement('td');
            let input = document.createElement('input');
            input.type = "text"; input.name = "cell_value";
            td.appendChild(input);
            tr.appendChild(td);
        }
        addDeleteBtn(tr);
        tbody.appendChild(tr);
    }

    function addNoteRow() {
        let tbody = document.getElementById('body-rows');
        let tr = document.createElement('tr');
        
        let type = document.createElement('input');
        type.type = "hidden"; type.name = "row_type"; type.value = "note";
        tr.appendChild(type);

        let colCount = document.getElementsByName('col_header').length;
        let td = document.createElement('td');
        td.colSpan = colCount;
        
        let input = document.createElement('input');
        input.type = "text"; input.name = "cell_value"; 
        input.className = "note-input";
        input.placeholder = "Type note here...";
        td.appendChild(input);
        tr.appendChild(td);
        addDeleteBtn(tr);
        tbody.appendChild(tr);
    }

    function addTotalRow() {
        let tbody = document.getElementById('body-rows');
        let tr = document.createElement('tr');

        let type = document.createElement('input');
        type.type = "hidden"; type.name = "row_type"; type.value = "total";
        tr.appendChild(type);

        let colCount = document.getElementsByName('col_header').length;
        
        let tdLabel = document.createElement('td');
        tdLabel.colSpan = colCount - 1; 
        tdLabel.innerText = "TOTAL:";
        tdLabel.style.textAlign = "right";
        tdLabel.style.fontWeight = "bold";
        tr.appendChild(tdLabel);

        let tdVal = document.createElement('td');
        let input = document.createElement('input');
        input.type = "text"; input.name = "cell_value"; 
        input.className = "total-input";
        tdVal.appendChild(input);
        tr.appendChild(tdVal);
        addDeleteBtn(tr);
        tbody.appendChild(tr);
    }

    function addDeleteBtn(row) {
        let td = document.createElement('td');
        let btn = document.createElement('button');
        btn.innerText = "X";
        btn.className = "btn-red";
        btn.type = "button";
        btn.onclick = function() { row.remove(); };
        td.appendChild(btn);
        row.appendChild(td);
    }

    // --- INITIALIZE ---
    let container = document.getElementById('col-container');
    container.appendChild(createColumnInput("Date"));
    container.appendChild(createColumnInput("Description"));
    container.appendChild(createColumnInput("Amount"));
    updateTableHeaders();
    addRow(); 

</script>

</body>
</html>
