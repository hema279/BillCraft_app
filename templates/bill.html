<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>BillCraft Professional</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; max-width: 1000px; margin: auto; padding: 20px; background: #f4f7f6; }
        .box { background: white; padding: 20px; margin-bottom: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        h3 { margin-top: 0; color: #333; border-bottom: 2px solid #007bff; padding-bottom: 10px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 0.9em; color: #555; }
        input, select, textarea { width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; }
        .full-width { grid-column: span 2; }
        
        /* Table Styles */
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #ddd; padding: 5px; }
        th { background: #eee; }
        td input { border: none; width: 100%; text-align: center; font-size: 14px; }
        
        .btn { padding: 8px 15px; cursor: pointer; border: none; border-radius: 4px; color: white; font-weight: bold; margin-right: 5px;}
        .btn-blue { background: #007bff; }
        .btn-green { background: #28a745; }
        .btn-red { background: #dc3545; }
        .btn-main { background: #222; width: 100%; font-size: 1.2em; margin-top: 20px; padding: 15px; }
    </style>
</head>
<body>

<form action="/" method="POST" enctype="multipart/form-data">

    <div class="box">
        <h3>1. Page Settings</h3>
        <div class="grid">
            <div>
                <label>Page Orientation</label>
                <select name="orientation">
                    <option value="P">Portrait (Tall A4) - BEST FOR LISTS</option>
                    <option value="L">Landscape (Wide A4) - BEST FOR WIDE TABLES</option>
                </select>
            </div>
            <div>
                <label>Output Filename</label>
                <input type="text" name="filename" placeholder="invoice_001">
            </div>
        </div>
    </div>

    <div class="box">
        <h3>2. Header & Client</h3>
        <div class="grid">
            <div>
                <label>Header Image (Letterhead)</label>
                <input type="file" name="header_img">
            </div>
            <div>
                <label>Signature Image</label>
                <input type="file" name="sig_img">
            </div>
            <div class="full-width">
                <label>Client Address ("TO")</label>
                <textarea name="client_address" rows="4" placeholder="To Address..."></textarea>
            </div>
        </div>
    </div>

    <div class="box">
        <h3>3. Bill Details</h3>
        <div class="grid">
            <div>
                <label>Date</label>
                <input type="text" name="date" placeholder="DD-MM-YYYY" required>
            </div>
            <div>
                <label>Bill No</label>
                <input type="text" name="bill_no" placeholder="101" required>
            </div>
            <div class="full-width">
                <label>Subject Line</label>
                <input type="text" name="subject" placeholder="Transport charges for...">
            </div>
            <div>
                <label>Period From</label>
                <input type="text" name="from_date">
            </div>
            <div>
                <label>Period To</label>
                <input type="text" name="to_date">
            </div>
        </div>
    </div>

    <div class="box">
        <h3>4. Item Table</h3>
        <button type="button" class="btn btn-blue" onclick="addColumn()">+ Add Column</button>
        <table id="main-table">
            <thead>
                <tr id="head-row">
                    </tr>
            </thead>
            <tbody id="body-rows">
                </tbody>
        </table>
        <div style="margin-top:10px;">
            <button type="button" class="btn btn-blue" onclick="addRow()">+ Row</button>
            <button type="button" class="btn btn-green" onclick="addTotal()">+ Total</button>
        </div>
    </div>

    <div class="box">
        <h3>5. Signature Info</h3>
        <div class="grid">
            <div>
                <label>Company Name (e.g. For SST)</label>
                <input type="text" name="company_name">
            </div>
            <div>
                <label>Signer Name (e.g. G. Hemasri)</label>
                <input type="text" name="signer_name">
            </div>
        </div>
    </div>

    <button type="submit" class="btn btn-main">Generate Professional PDF</button>

</form>

<script>
    function addColumn(name = "New Col") {
        let th = document.createElement('th');
        th.innerHTML = `<input type="text" name="col_header" value="${name}" style="font-weight:bold; background:#eee;">`;
        document.getElementById('head-row').appendChild(th);
        
        let rows = document.getElementById('body-rows').children;
        for (let row of rows) {
            if (row.className === 'data-row') {
                let td = document.createElement('td');
                td.innerHTML = `<input type="text" name="cell_value">`;
                row.appendChild(td);
            }
        }
    }

    function addRow() {
        let tr = document.createElement('tr');
        tr.className = 'data-row';
        tr.innerHTML = `<input type="hidden" name="row_type" value="data">`;
        
        let headers = document.getElementById('head-row').children;
        for (let i = 0; i < headers.length; i++) {
            let td = document.createElement('td');
            td.innerHTML = `<input type="text" name="cell_value">`;
            tr.appendChild(td);
        }
        
        // Add delete button
        let tdDel = document.createElement('td');
        tdDel.style.border = "none";
        tdDel.innerHTML = `<button type="button" class="btn btn-red" onclick="this.parentElement.parentElement.remove()">X</button>`;
        tr.appendChild(tdDel);
        
        document.getElementById('body-rows').appendChild(tr);
    }

    function addTotal() {
        let tr = document.createElement('tr');
        tr.innerHTML = `<input type="hidden" name="row_type" value="total">`;
        let headers = document.getElementById('head-row').children;
        
        let labelCell = document.createElement('td');
        labelCell.colSpan = headers.length - 1;
        labelCell.innerText = "TOTAL:";
        labelCell.style.textAlign = "right";
        labelCell.style.fontWeight = "bold";
        tr.appendChild(labelCell);
        
        let valCell = document.createElement('td');
        valCell.innerHTML = `<input type="text" name="cell_value" style="font-weight:bold;">`;
        tr.appendChild(valCell);
        
        // Add delete button
        let tdDel = document.createElement('td');
        tdDel.style.border = "none";
        tdDel.innerHTML = `<button type="button" class="btn btn-red" onclick="this.parentElement.parentElement.remove()">X</button>`;
        tr.appendChild(tdDel);
        
        document.getElementById('body-rows').appendChild(tr);
    }

    // Init Defaults
    addColumn("Date");
    addColumn("Description");
    addColumn("Truck No");
    addColumn("Amount");
    addRow();
    addRow();
</script>

</body>
</html>
